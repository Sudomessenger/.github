<svg width="1400" height="640" viewBox="0 0 1400 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#10172A"/>
    </linearGradient>
    <linearGradient id="lightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37A2FF"/>
      <stop offset="0.5" stop-color="#378ADD"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37A2FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.05"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="liftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1400" height="640" rx="28" fill="url(#darkBg)"/>
  <rect width="1400" height="640" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1398" height="638" rx="27" stroke="#37A2FF" stroke-opacity="0.32" stroke-width="2"/>

  <text x="72" y="80" fill="#7DD3FC" font-size="13" font-weight="900" letter-spacing="3">ENGINEERING MAP</text>
  <text x="72" y="132" fill="#F8FAFC" font-size="44" font-weight="900" letter-spacing="-1.3">Repositories orbit the protocol.</text>
  <text x="72" y="168" fill="#94A3B8" font-size="18">Five private codebases working together as one Web3 messenger platform.</text>

  <line x1="700" y1="300" x2="210" y2="200" stroke="#37A2FF" stroke-opacity="0.55" stroke-width="2"/><line x1="700" y1="300" x2="210" y2="380" stroke="#6366F1" stroke-opacity="0.55" stroke-width="2"/><line x1="700" y1="300" x2="1190" y2="200" stroke="#22C55E" stroke-opacity="0.55" stroke-width="2"/><line x1="700" y1="300" x2="1190" y2="380" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="2"/><line x1="700" y1="300" x2="700" y2="480" stroke="#F472B6" stroke-opacity="0.55" stroke-width="2"/>

  <g transform="translate(620 220)" filter="url(#softShadow)">
    <rect width="160" height="160" rx="80" fill="url(#brand)"/>
    <text x="80" y="86" text-anchor="middle" fill="white" font-size="22" font-weight="900">Sudo</text>
    <text x="80" y="110" text-anchor="middle" fill="white" fill-opacity="0.85" font-size="12" font-weight="800" letter-spacing="2">PROTOCOL</text>
  </g>

  
  <g transform="translate(80 150)" filter="url(#softShadow)">
    <rect width="260" height="100" rx="22" fill="#0F172A" stroke="#1E293B"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#37A2FF"/>
    <text x="28" y="42" fill="#F8FAFC" font-size="20" font-weight="850">sudo_app</text>
    <text x="28" y="68" fill="#94A3B8" font-size="13">Flutter mobile</text>
    <circle cx="232" cy="50" r="8" fill="#37A2FF" fill-opacity="0.32"/>
    <circle cx="232" cy="50" r="3" fill="#37A2FF"/>
  </g>

  <g transform="translate(80 330)" filter="url(#softShadow)">
    <rect width="260" height="100" rx="22" fill="#0F172A" stroke="#1E293B"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#6366F1"/>
    <text x="28" y="42" fill="#F8FAFC" font-size="20" font-weight="850">protocol</text>
    <text x="28" y="68" fill="#94A3B8" font-size="13">Admin + APIs</text>
    <circle cx="232" cy="50" r="8" fill="#6366F1" fill-opacity="0.32"/>
    <circle cx="232" cy="50" r="3" fill="#6366F1"/>
  </g>

  <g transform="translate(1060 150)" filter="url(#softShadow)">
    <rect width="260" height="100" rx="22" fill="#0F172A" stroke="#1E293B"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#22C55E"/>
    <text x="28" y="42" fill="#F8FAFC" font-size="20" font-weight="850">website</text>
    <text x="28" y="68" fill="#94A3B8" font-size="13">Public web</text>
    <circle cx="232" cy="50" r="8" fill="#22C55E" fill-opacity="0.32"/>
    <circle cx="232" cy="50" r="3" fill="#22C55E"/>
  </g>

  <g transform="translate(1060 330)" filter="url(#softShadow)">
    <rect width="260" height="100" rx="22" fill="#0F172A" stroke="#1E293B"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#F59E0B"/>
    <text x="28" y="42" fill="#F8FAFC" font-size="20" font-weight="850">docs</text>
    <text x="28" y="68" fill="#94A3B8" font-size="13">Specifications</text>
    <circle cx="232" cy="50" r="8" fill="#F59E0B" fill-opacity="0.32"/>
    <circle cx="232" cy="50" r="3" fill="#F59E0B"/>
  </g>

  <g transform="translate(570 430)" filter="url(#softShadow)">
    <rect width="260" height="100" rx="22" fill="#0F172A" stroke="#1E293B"/>
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#F472B6"/>
    <text x="28" y="42" fill="#F8FAFC" font-size="20" font-weight="850">whitepaper</text>
    <text x="28" y="68" fill="#94A3B8" font-size="13">Research</text>
    <circle cx="232" cy="50" r="8" fill="#F472B6" fill-opacity="0.32"/>
    <circle cx="232" cy="50" r="3" fill="#F472B6"/>
