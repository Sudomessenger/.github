<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" stroke="#378ADD" stroke-opacity="0.26" stroke-width="2"/>
  <text x="64" y="72" fill="#378ADD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="3">PRODUCT SURFACE</text>
  <text x="64" y="122" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="850" letter-spacing="-1.4">Everything Web3 needs, inside chat.</text>
  <text x="64" y="156" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Start with a conversation. Move to identity, payment, meeting, or settlement without switching apps.</text>
  <g transform="translate(64 220)" filter="url(#shadow)"><rect width="250" height="128" rx="22" fill="white"/><text x="30" y="48" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="850">Wallet identity</text><text x="30" y="82" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Sign in with wallet.</text><text x="30" y="106" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Keep keys local.</text></g>
  <g transform="translate(342 220)" filter="url(#shadow)"><rect width="250" height="128" rx="22" fill="white"/><text x="30" y="48" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="850">Encrypted chat</text><text x="30" y="82" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Private peers, groups,</text><text x="30" y="106" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">channels and media.</text></g>
  <g transform="translate(620 220)" filter="url(#shadow)"><rect width="250" height="128" rx="22" fill="white"/><text x="30" y="48" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="850">Crypto in-line</text><text x="30" y="82" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Send, swap, bridge,</text><text x="30" y="106" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">and open dApps.</text></g>
  <g transform="translate(898 220)" filter="url(#shadow)"><rect width="238" height="128" rx="22" fill="white"/><text x="30" y="48" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="850">Escrow</text><text x="30" y="82" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Milestones, validators,</text><text x="30" y="106" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">and settlement flows.</text></g>
</svg>
