<svg width="1400" height="680" viewBox="0 0 1400 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1400" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37A2FF"/>
      <stop offset="0.52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#37A2FF"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 110) rotate(90) scale(260)">
      <stop stop-color="#37A2FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#37A2FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1400" height="680" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="680" rx="30" fill="url(#orb)"/>
  <rect x="1.5" y="1.5" width="1397" height="677" rx="28.5" stroke="url(#stroke)" stroke-opacity="0.42" stroke-width="3"/>

  <text x="80" y="84" fill="#7DD3FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="4">CAPABILITIES</text>
  <text x="80" y="140" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="850" letter-spacing="-1.6">Private messaging meets on-chain execution.</text>
  <text x="80" y="182" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Sudo combines social coordination, wallet custody, protocol operations, and automated Web3 tools.</text>

  <g transform="translate(80 246)" filter="url(#shadow)">
    <rect width="380" height="154" rx="28" fill="#0F172A" stroke="#26344D"/>
    <rect x="30" y="32" width="54" height="54" rx="18" fill="#082F49"/>
    <text x="57" y="68" text-anchor="middle" fill="#7DD3FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">S</text>
    <text x="108" y="56" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850">Sudo Wallet</text>
    <text x="108" y="88" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Multi-chain custody with seed phrases</text>
    <text x="108" y="114" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">kept on-device.</text>
  </g>

  <g transform="translate(510 246)" filter="url(#shadow)">
    <rect width="380" height="154" rx="28" fill="#0F172A" stroke="#26344D"/>
    <rect x="30" y="32" width="54" height="54" rx="18" fill="#312E81"/>
    <text x="57" y="68" text-anchor="middle" fill="#C4B5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">W</text>
    <text x="108" y="56" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850">WalletConnect</text>
    <text x="108" y="88" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Connect 590+ wallets and external</text>
    <text x="108" y="114" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">dApps through Reown AppKit.</text>
  </g>

  <g transform="translate(940 246)" filter="url(#shadow)">
    <rect width="380" height="154" rx="28" fill="#0F172A" stroke="#26344D"/>
    <rect x="30" y="32" width="54" height="54" rx="18" fill="#064E3B"/>
    <text x="57" y="68" text-anchor="middle" fill="#86EFAC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">G</text>
    <text x="108" y="56" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850">Smart Groups</text>
    <text x="108" y="88" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Channels, broadcasts, community</text>
    <text x="108" y="114" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">spaces, and on-chain group logic.</text>
  </g>

  <g transform="translate(80 438)" filter="url(#shadow)">
    <rect width="380" height="154" rx="28" fill="#0F172A" stroke="#26344D"/>
    <rect x="30" y="32" width="54" height="54" rx="18" fill="#3B0764"/>
    <text x="57" y="68" text-anchor="middle" fill="#F3E8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">E</text>
    <text x="108" y="56" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850">Escrow & Swaps</text>
    <text x="108" y="88" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Payments, bridge flows, swaps, and</text>
    <text x="108" y="114" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">validator-backed settlement.</text>
  </g>

  <g transform="translate(510 438)" filter="url(#shadow)">
    <rect width="380" height="154" rx="28" fill="#0F172A" stroke="#26344D"/>
    <rect x="30" y="32" width="54" height="54" rx="18" fill="#451A03"/>
    <text x="57" y="68" text-anchor="middle" fill="#FDBA74" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">B</text>
    <text x="108" y="56" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850">Web3 Bots</text>
    <text x="108" y="88" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Audits, transaction tracking, token</text>
    <text x="108" y="114" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">helpers, and mini-app launchers.</text>
  </g>

  <g transform="translate(940 438)" filter="url(#shadow)">
    <rect width="380" height="154" rx="28" fill="#0F172A" stroke="#26344D"/>
    <rect x="30" y="32" width="54" height="54" rx="18" fill="#172554"/>
    <text x="57" y="68" text-anchor="middle" fill="#BFDBFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">V</text>
    <text x="108" y="56" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850">Voice & Video</text>
    <text x="108" y="88" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Live meetings, stories, voice notes,</text>
    <text x="108" y="114" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">files, and media-rich updates.</text>
  </g>
</svg>
