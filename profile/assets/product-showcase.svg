    <text x="54" y="66" text-anchor="middle" fill="#C4B5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28">&</text>
    <text x="34" y="112" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">Encrypted chat</text>
    <text x="34" y="152" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Private peer chat, groups,</text>
    <text x="34" y="178" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">channels, and broadcasts.</text>
    <rect x="34" y="206" width="88" height="28" rx="14" fill="#312E81"/>
    <text x="78" y="225" text-anchor="middle" fill="#DDD6FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="850">E2EE</text>
