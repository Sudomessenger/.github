  <g transform="translate(704 250)" filter="url(#shadow)">
    <rect width="282" height="250" rx="30" fill="#0F172A" stroke="#26344D"/>
    <circle cx="54" cy="58" r="25" fill="#064E3B"/>
    <text x="54" y="66" text-anchor="middle" fill="#86EFAC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28">¯</text>
    <text x="34" y="112" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">Crypto in-line</text>
    <text x="34" y="152" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Send tokens, swap, bridge,</text>
    <text x="34" y="178" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">and open dApps from chat.</text>
