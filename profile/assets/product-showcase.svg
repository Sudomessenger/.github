    <text x="34" y="152" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Sign in with wallet, create</text>
    <text x="34" y="178" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">profiles, and keep keys local.</text>
    <rect x="34" y="206" width="126" height="28" rx="14" fill="#172554"/>
