  <text x="80" y="86" fill="#7DD3FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="4">PRODUCT SURFACE</text>
  <text x="80" y="142" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="850" letter-spacing="-1.8">Everything Web3 needs, inside chat.</text>
  <text x="80" y="184" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">The app is designed around natural conversations that can become payments, contracts, meetings, or settlements.</text>

  <g transform="translate(80 250)" filter="url(#shadow)">
