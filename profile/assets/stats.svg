<svg width="1400" height="260" viewBox="0 0 1400 260" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#10172A"/>
    </linearGradient>
    <linearGradient id="lightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37A2FF"/>
      <stop offset="0.5" stop-color="#378ADD"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37A2FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.05"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="liftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1400" height="260" rx="22" fill="url(#lightBg)"/>
  <rect x="1" y="1" width="1398" height="258" rx="21" stroke="#DBEAFE" stroke-width="2"/>
  
  <g transform="translate(64 56)" filter="url(#liftShadow)">
    <rect width="298" height="148" rx="22" fill="white"/>
    <rect x="0.5" y="0.5" width="297" height="147" rx="21.5" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="6" height="148" rx="3" fill="#37A2FF"/>
    <text x="32" y="68" fill="#0F172A" font-size="44" font-weight="900" letter-spacing="-1.5">5</text>
    <text x="32" y="100" fill="#0F172A" font-size="16" font-weight="800">Repositories</text>
    <text x="32" y="124" fill="#64748B" font-size="13">Org engineering surface</text>
  </g>

  <g transform="translate(386 56)" filter="url(#liftShadow)">
    <rect width="298" height="148" rx="22" fill="white"/>
    <rect x="0.5" y="0.5" width="297" height="147" rx="21.5" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="6" height="148" rx="3" fill="#6366F1"/>
    <text x="32" y="68" fill="#0F172A" font-size="44" font-weight="900" letter-spacing="-1.5">100%</text>
    <text x="32" y="100" fill="#0F172A" font-size="16" font-weight="800">Non-custodial</text>
    <text x="32" y="124" fill="#64748B" font-size="13">Keys stay on device</text>
  </g>

  <g transform="translate(708 56)" filter="url(#liftShadow)">
    <rect width="298" height="148" rx="22" fill="white"/>
    <rect x="0.5" y="0.5" width="297" height="147" rx="21.5" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="6" height="148" rx="3" fill="#22C55E"/>
    <text x="32" y="68" fill="#0F172A" font-size="44" font-weight="900" letter-spacing="-1.5">590+</text>
    <text x="32" y="100" fill="#0F172A" font-size="16" font-weight="800">Wallets supported</text>
    <text x="32" y="124" fill="#64748B" font-size="13">via WalletConnect</text>
  </g>

  <g transform="translate(1030 56)" filter="url(#liftShadow)">
    <rect width="298" height="148" rx="22" fill="white"/>
    <rect x="0.5" y="0.5" width="297" height="147" rx="21.5" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="6" height="148" rx="3" fill="#F59E0B"/>
    <text x="32" y="68" fill="#0F172A" font-size="44" font-weight="900" letter-spacing="-1.5">11</text>
    <text x="32" y="100" fill="#0F172A" font-size="16" font-weight="800">Validators</text>
    <text x="32" y="124" fill="#64748B" font-size="13">Mainnet ready</text>
