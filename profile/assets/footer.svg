  <text x="72" y="284" fill="#475569" font-size="11" font-weight="800" letter-spacing="2">SUDO GOVERNING COUNCIL  -  SUDO, SUDO CHAT AND THE SUDO LOGO ARE TRADEMARKS OF THE SUDO GOVERNING COUNCIL.</text>
