    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 250) rotate(90) scale(110)">
      <stop stop-color="#6366F1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#shine)"/>
  <rect x="1" y="1" width="1198" height="338" rx="17" stroke="url(#border)" stroke-opacity="0.55"/>

  <circle cx="980" cy="70" r="130" fill="url(#orb1)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="250" r="110" fill="url(#orb2)">
    <animate attributeName="opacity" values="1;0.65;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.35" stroke="#37A2FF" stroke-opacity="0.25">
