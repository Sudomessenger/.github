<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="0.45" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37A2FF" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#378ADD"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="52" y1="48" x2="148" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37A2FF"/>
      <stop offset="0.52" stop-color="#378ADD"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="shine" x1="900" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37A2FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 70) rotate(90) scale(130)">
      <stop stop-color="#378ADD" stop-opacity="0.35"/>
