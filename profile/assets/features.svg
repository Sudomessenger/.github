<svg width="1400" height="700" viewBox="0 0 1400 700" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#10172A"/>
    </linearGradient>
    <linearGradient id="lightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37A2FF"/>
      <stop offset="0.5" stop-color="#378ADD"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37A2FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.05"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="liftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1400" height="700" rx="28" fill="url(#darkBg)"/>
  <rect width="1400" height="700" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1398" height="698" rx="27" stroke="#6366F1" stroke-opacity="0.32" stroke-width="2"/>

  <text x="72" y="86" fill="#7DD3FC" font-size="13" font-weight="900" letter-spacing="3">CAPABILITIES</text>
  <text x="72" y="138" fill="#F8FAFC" font-size="48" font-weight="900" letter-spacing="-1.4">Six surfaces. One conversation.</text>
  <text x="72" y="174" fill="#94A3B8" font-size="18">Sudo unifies wallet, messaging, payments, escrow, meetings and bots inside a single private app.</text>

  
  <g transform="translate(72 220)" filter="url(#softShadow)">
    <rect width="410" height="222" rx="26" fill="#0F172A" stroke="#1E293B"/>
    <rect x="28" y="28" width="56" height="56" rx="18" fill="#7DD3FC" fill-opacity="0.22"/>
    <rect x="42" y="46" width="28" height="22" rx="4" fill="none" stroke="#7DD3FC" stroke-width="2.5"/><circle cx="64" cy="57" r="3" fill="#7DD3FC"/>
    <text x="28" y="128" fill="#F8FAFC" font-size="24" font-weight="850">Sudo Wallet</text>
    <text x="28" y="160" fill="#94A3B8" font-size="15">Multi-chain custody with seed</text>
    <text x="28" y="182" fill="#94A3B8" font-size="15">phrases that never leave device.</text>
    <rect x="28" y="162" width="160" height="32" rx="16" fill="#7DD3FC" fill-opacity="0.18"/>
    <text x="108" y="183" text-anchor="middle" fill="#7DD3FC" font-size="12" font-weight="800" letter-spacing="1.4">NON-CUSTODY</text>
  </g>

  
  <g transform="translate(496 220)" filter="url(#softShadow)">
    <rect width="410" height="222" rx="26" fill="#0F172A" stroke="#1E293B"/>
    <rect x="28" y="28" width="56" height="56" rx="18" fill="#C4B5FD" fill-opacity="0.22"/>
    <path d="M40 48 H72 Q76 48 76 52 V64 Q76 68 72 68 H56 L48 76 V68 H44 Q40 68 40 64 Z" fill="none" stroke="#C4B5FD" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="28" y="128" fill="#F8FAFC" font-size="24" font-weight="850">Encrypted Chat</text>
    <text x="28" y="160" fill="#94A3B8" font-size="15">P2P chat, groups, channels,</text>
    <text x="28" y="182" fill="#94A3B8" font-size="15">broadcasts and rich media.</text>
    <rect x="28" y="162" width="160" height="32" rx="16" fill="#C4B5FD" fill-opacity="0.18"/>
    <text x="108" y="183" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="800" letter-spacing="1.4">E2EE</text>
  </g>

  
  <g transform="translate(920 220)" filter="url(#softShadow)">
    <rect width="408" height="222" rx="26" fill="#0F172A" stroke="#1E293B"/>
    <rect x="28" y="28" width="56" height="56" rx="18" fill="#86EFAC" fill-opacity="0.22"/>
    <path d="M40 52 H72 L66 46 M76 64 H44 L50 70" fill="none" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="128" fill="#F8FAFC" font-size="24" font-weight="850">Crypto In-line</text>
    <text x="28" y="160" fill="#94A3B8" font-size="15">Send, swap, bridge and open</text>
    <text x="28" y="182" fill="#94A3B8" font-size="15">dApps without leaving chat.</text>
    <rect x="28" y="162" width="160" height="32" rx="16" fill="#86EFAC" fill-opacity="0.18"/>
    <text x="108" y="183" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="800" letter-spacing="1.4">ON-CHAIN</text>
  </g>

  
  <g transform="translate(72 458)" filter="url(#softShadow)">
    <rect width="410" height="222" rx="26" fill="#0F172A" stroke="#1E293B"/>
    <rect x="28" y="28" width="56" height="56" rx="18" fill="#F0ABFC" fill-opacity="0.22"/>
    <path d="M56 42 L72 48 V60 Q72 70 56 76 Q40 70 40 60 V48 Z" fill="none" stroke="#F0ABFC" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 58 L55 63 L64 54" fill="none" stroke="#F0ABFC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="128" fill="#F8FAFC" font-size="24" font-weight="850">Validator Escrow</text>
    <text x="28" y="160" fill="#94A3B8" font-size="15">Milestones, dispute resolution,</text>
    <text x="28" y="182" fill="#94A3B8" font-size="15">and validator-backed settlement.</text>
    <rect x="28" y="162" width="160" height="32" rx="16" fill="#F0ABFC" fill-opacity="0.18"/>
    <text x="108" y="183" text-anchor="middle" fill="#F0ABFC" font-size="12" font-weight="800" letter-spacing="1.4">VALIDATED</text>
  </g>

  
  <g transform="translate(496 458)" filter="url(#softShadow)">
    <rect width="410" height="222" rx="26" fill="#0F172A" stroke="#1E293B"/>
    <rect x="28" y="28" width="56" height="56" rx="18" fill="#FDBA74" fill-opacity="0.22"/>
    <rect x="40" y="46" width="32" height="22" rx="4" fill="none" stroke="#FDBA74" stroke-width="2.5"/><path d="M72 50 L80 46 V68 L72 64 Z" fill="none" stroke="#FDBA74" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="28" y="128" fill="#F8FAFC" font-size="24" font-weight="850">Voice and Video</text>
    <text x="28" y="160" fill="#94A3B8" font-size="15">Live meetings, stories, voice</text>
    <text x="28" y="182" fill="#94A3B8" font-size="15">notes and screen sharing.</text>
    <rect x="28" y="162" width="160" height="32" rx="16" fill="#FDBA74" fill-opacity="0.18"/>
    <text x="108" y="183" text-anchor="middle" fill="#FDBA74" font-size="12" font-weight="800" letter-spacing="1.4">LIVEKIT</text>
  </g>

  
  <g transform="translate(920 458)" filter="url(#softShadow)">
    <rect width="408" height="222" rx="26" fill="#0F172A" stroke="#1E293B"/>
    <rect x="28" y="28" width="56" height="56" rx="18" fill="#FCA5A5" fill-opacity="0.22"/>
    <rect x="42" y="46" width="28" height="24" rx="6" fill="none" stroke="#FCA5A5" stroke-width="2.5"/><circle cx="50" cy="58" r="2.5" fill="#FCA5A5"/><circle cx="62" cy="58" r="2.5" fill="#FCA5A5"/><path d="M56 42 V46" stroke="#FCA5A5" stroke-width="2.5" stroke-linecap="round"/>
    <text x="28" y="128" fill="#F8FAFC" font-size="24" font-weight="850">Web3 Bots</text>
    <text x="28" y="160" fill="#94A3B8" font-size="15">Audits, transaction tracking,</text>
    <text x="28" y="182" fill="#94A3B8" font-size="15">chain helpers and mini-apps.</text>
    <rect x="28" y="162" width="160" height="32" rx="16" fill="#FCA5A5" fill-opacity="0.18"/>
    <text x="108" y="183" text-anchor="middle" fill="#FCA5A5" font-size="12" font-weight="800" letter-spacing="1.4">AUTOMATIONS</text>
  </g>

</svg>