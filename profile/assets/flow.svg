<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.55" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#10172A"/>
    </linearGradient>
    <linearGradient id="lightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37A2FF"/>
      <stop offset="0.5" stop-color="#378ADD"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="brandSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37A2FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity="0.05"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="liftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1400" height="560" rx="28" fill="url(#lightBg)"/>
  <rect x="1" y="1" width="1398" height="558" rx="27" stroke="#378ADD" stroke-opacity="0.28" stroke-width="2"/>

  <text x="72" y="80" fill="#378ADD" font-size="13" font-weight="900" letter-spacing="3">THE FLOW</text>
  <text x="72" y="132" fill="#0F172A" font-size="44" font-weight="900" letter-spacing="-1.3">Chat. Pay. Settle.</text>
  <text x="72" y="168" fill="#475569" font-size="18">From a casual message to validator-signed settlement in three taps.</text>

  <g transform="translate(0 30)">
    
  <g transform="translate(120 180)" filter="url(#softShadow)">
    <rect width="260" height="380" rx="36" fill="#0A0F1C" stroke="#26344D" stroke-width="2"/>
    <rect x="20" y="22" width="220" height="336" rx="28" fill="#101827"/>
    <text x="40" y="58" fill="#7DD3FC" font-size="11" font-weight="800" letter-spacing="1.5">CHAT</text>
    <rect x="40" y="74" width="180" height="50" rx="18" fill="#1E293B"/><text x="56" y="98" fill="#F8FAFC" font-size="13" font-weight="700">GM Alex - ready?</text><text x="56" y="115" fill="#94A3B8" font-size="11">just now</text><rect x="80" y="138" width="140" height="50" rx="18" fill="url(#brand)"/><text x="96" y="162" fill="white" font-size="13" font-weight="800">Yes, sending now</text><text x="96" y="179" fill="white" fill-opacity="0.85" font-size="11">12:04</text><rect x="40" y="208" width="180" height="50" rx="18" fill="#1E293B"/><text x="56" y="240" fill="#94A3B8" font-size="12">Typing</text>
  </g>

    
  <g transform="translate(560 180)" filter="url(#softShadow)">
    <rect width="260" height="380" rx="36" fill="#0A0F1C" stroke="#26344D" stroke-width="2"/>
    <rect x="20" y="22" width="220" height="336" rx="28" fill="#101827"/>
    <text x="40" y="58" fill="#7DD3FC" font-size="11" font-weight="800" letter-spacing="1.5">PAY</text>
    <rect x="40" y="74" width="180" height="120" rx="20" fill="#0B1220" stroke="#26344D"/><text x="58" y="106" fill="#94A3B8" font-size="11" font-weight="800" letter-spacing="1.4">SEND</text><text x="58" y="142" fill="#F8FAFC" font-size="28" font-weight="900">0.25 ETH</text><text x="58" y="166" fill="#7DD3FC" font-size="12" font-weight="800">approx $980.40</text><rect x="40" y="208" width="180" height="50" rx="18" fill="url(#brand)"/><text x="130" y="240" text-anchor="middle" fill="white" font-size="14" font-weight="800">Confirm in wallet</text><text x="130" y="296" text-anchor="middle" fill="#475569" font-size="11">gas 0.0006 ETH</text>
  </g>

    
  <g transform="translate(1000 180)" filter="url(#softShadow)">
    <rect width="260" height="380" rx="36" fill="#0A0F1C" stroke="#26344D" stroke-width="2"/>
    <rect x="20" y="22" width="220" height="336" rx="28" fill="#101827"/>
    <text x="40" y="58" fill="#7DD3FC" font-size="11" font-weight="800" letter-spacing="1.5">SETTLE</text>
    <rect x="40" y="74" width="180" height="160" rx="20" fill="#0B1220" stroke="#26344D"/><text x="58" y="104" fill="#A7F3D0" font-size="11" font-weight="800" letter-spacing="1.5">SETTLED</text><circle cx="76" cy="142" r="12" fill="#064E3B"/><path d="M70 142 L75 147 L82 138" stroke="#86EFAC" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="146" fill="#F8FAFC" font-size="13" font-weight="800">Tx confirmed</text><text x="58" y="180" fill="#94A3B8" font-size="11">block 19,402,118</text><text x="58" y="200" fill="#94A3B8" font-size="11">3 of 3 validators</text><rect x="40" y="252" width="180" height="46" rx="18" fill="#172554" stroke="#1D4ED8"/><text x="130" y="280" text-anchor="middle" fill="#BFDBFE" font-size="13" font-weight="800">Share receipt</text>
  </g>

  </g>

  <g stroke="#94A3B8" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <path d="M408 400 H554"/>
    <path d="M848 400 H994"/>
  </g>
  <g fill="#378ADD">
    <circle cx="554" cy="400" r="5"/>
    <circle cx="994" cy="400" r="5"/>
  </g>
</svg>